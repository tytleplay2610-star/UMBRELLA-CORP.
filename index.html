<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMBRELLA CORP. // Central Terminal v4.0.2</title>
<style>
:root{--bg-base:#050508;--bg-panel:#0d0f14;--bg-panel-header:#141824;--primary-red:#e50914;--primary-red-glow:rgba(229,9,20,.4);--accent-blue:#00d2ff;--accent-green:#00ff66;--accent-yellow:#ffcc00;--text-main:#d0d7de;--text-muted:#6e7681;--border-color:#21262d;--border-red:#8b0000;--font-mono:'Courier New',Courier,monospace;--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
input,select,textarea{user-select:text}
body{background:var(--bg-base);color:var(--text-main);font-family:var(--font-sans);height:100vh;overflow:hidden;position:relative}
.scanline{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,0) 50%,rgba(0,0,0,.3) 50%,rgba(0,0,0,.3));background-size:100% 4px;pointer-events:none;z-index:999;opacity:.6}
.hazard-overlay{position:fixed;inset:0;pointer-events:none;z-index:998;box-shadow:inset 0 0 100px rgba(229,9,20,.6);animation:pulse-red 2s infinite alternate;display:none}
@keyframes pulse-red{0%{opacity:.3}100%{opacity:.9}}
.umbrella-logo{width:52px;height:52px;display:inline-block;vertical-align:middle;flex-shrink:0;filter:drop-shadow(0 0 6px rgba(229,9,20,.6))}
#login-overlay{position:fixed;inset:0;background:rgba(5,5,8,.95);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
.login-box{background:var(--bg-panel);border:1px solid var(--primary-red);width:450px;max-width:90%;padding:30px;border-radius:4px;box-shadow:0 0 30px rgba(229,9,20,.3)}
.login-header{text-align:center;margin-bottom:25px;border-bottom:1px solid var(--border-color);padding-bottom:15px}
.login-title{font-family:var(--font-mono);font-size:20px;font-weight:bold;letter-spacing:2px;color:#fff;margin-top:10px}
.login-subtitle{font-size:11px;color:var(--primary-red);letter-spacing:1.5px;margin-top:5px;text-transform:uppercase}
.login-tabs{display:flex;margin-bottom:20px;border-bottom:1px solid var(--border-color)}
.login-tab-btn{flex:1;padding:10px;background:none;border:none;color:var(--text-muted);font-family:var(--font-mono);cursor:pointer;border-bottom:2px solid transparent;font-size:13px}
.login-tab-btn.active{color:var(--primary-red);border-bottom:2px solid var(--primary-red);font-weight:bold}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase}
.form-control{width:100%;padding:12px;background:#000;border:1px solid var(--border-color);color:var(--accent-green);font-family:var(--font-mono);font-size:14px;border-radius:3px;outline:none;transition:border-color .3s}
.form-control:focus{border-color:var(--primary-red);box-shadow:0 0 8px var(--primary-red-glow)}
select.form-control{color:var(--text-main);cursor:pointer}
.btn{width:100%;padding:12px;background:var(--primary-red);color:#fff;border:none;font-family:var(--font-mono);font-weight:bold;letter-spacing:1px;cursor:pointer;border-radius:3px;text-transform:uppercase;transition:all .2s}
.btn:hover{background:#f00;box-shadow:0 0 15px var(--primary-red-glow)}
.btn-danger{background:#8b0000}
.btn-danger:hover{background:var(--primary-red)}
.login-error{min-height:18px;margin-bottom:10px;font-family:var(--font-mono);font-size:12px;color:var(--primary-red)}
.preset-users{margin-top:20px;padding-top:15px;border-top:1px dashed var(--border-color)}
.preset-title{font-size:10px;font-family:var(--font-mono);color:var(--text-muted);margin-bottom:8px;text-transform:uppercase}
.preset-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#161b22;border:1px solid var(--border-color);padding:4px 8px;font-size:10px;font-family:var(--font-mono);border-radius:3px;cursor:pointer;color:var(--text-main);transition:all .2s}
.chip:hover{border-color:var(--primary-red);color:#fff}
#app-container{display:none;flex-direction:column;height:100vh}
header{background:var(--bg-panel);border-bottom:1px solid var(--border-color);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:15px}
.brand-text h1{font-family:var(--font-mono);font-size:16px;letter-spacing:2px;color:#fff}
.brand-text p{font-size:10px;color:var(--primary-red);letter-spacing:1px;font-family:var(--font-mono)}
.user-status{display:flex;align-items:center;gap:20px;font-family:var(--font-mono);font-size:12px}
.clearance-badge{padding:4px 10px;border-radius:3px;font-family:var(--font-mono);font-size:11px;font-weight:bold;letter-spacing:1px;text-transform:uppercase}
.lvl-1{background:rgba(0,210,255,.2);color:var(--accent-blue);border:1px solid var(--accent-blue)}
.lvl-2{background:rgba(0,255,102,.2);color:var(--accent-green);border:1px solid var(--accent-green)}
.lvl-3{background:rgba(255,204,0,.2);color:var(--accent-yellow);border:1px solid var(--accent-yellow)}
.lvl-4{background:rgba(229,9,20,.3);color:var(--primary-red);border:1px solid var(--primary-red)}
.logout-btn{background:transparent;border:1px solid var(--border-color);color:var(--text-muted);padding:6px 12px;font-family:var(--font-mono);font-size:11px;cursor:pointer;border-radius:3px}
.logout-btn:hover{color:#fff;border-color:var(--primary-red)}
.workspace{flex:1;display:flex;overflow:hidden;min-height:0}
.sidebar{width:220px;background:var(--bg-panel);border-right:1px solid var(--border-color);padding:15px 0;overflow-y:auto;flex-shrink:0}
.nav-item{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;font-family:var(--font-mono);font-size:12px;color:var(--text-main);cursor:pointer;border-left:3px solid transparent}
.nav-item:hover{background:var(--bg-panel-header)}
.nav-item.active{background:var(--bg-panel-header);border-left-color:var(--primary-red);color:#fff}
.nav-item.locked{color:var(--text-muted);cursor:not-allowed}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.content{flex:1;padding:20px;overflow-y:auto}
.panel{background:var(--bg-panel);border:1px solid var(--border-color);border-radius:4px;margin-bottom:16px}
.panel-header{background:var(--bg-panel-header);padding:10px 15px;font-family:var(--font-mono);font-size:12px;letter-spacing:1px;color:#fff;border-bottom:1px solid var(--border-color)}
.panel-body{padding:15px;font-size:13px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:#000;border:1px solid var(--border-color);padding:12px;border-radius:3px}
.stat b{display:block;font-family:var(--font-mono);font-size:22px;margin-top:4px}
.stat span{font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
.ok{color:var(--accent-green)}.warn{color:var(--accent-yellow)}.bad{color:var(--primary-red)}
table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:12px}
td,th{padding:8px;border-bottom:1px solid var(--border-color);text-align:left}
th{color:var(--text-muted);font-weight:normal}
.term-bar{display:flex;justify-content:space-between;align-items:center;background:var(--bg-panel-header);border-top:1px solid var(--border-red);padding:4px 15px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.term-bar button{background:transparent;border:1px solid var(--border-color);color:var(--text-main);font-family:var(--font-mono);font-size:11px;padding:4px 12px;border-radius:3px;cursor:pointer}
.term-bar button:hover{color:#fff;border-color:var(--primary-red)}
.terminal{height:150px;background:#000;border-top:1px solid var(--border-red);padding:10px 15px;overflow-y:auto;font-family:var(--font-mono);font-size:12px;color:var(--accent-green)}
.terminal div{margin-bottom:3px}
.terminal .t-bad{color:var(--primary-red)}
.terminal .t-warn{color:var(--accent-yellow)}
textarea.form-control{resize:vertical;min-height:90px}
.btn-sm{width:auto;padding:8px 14px;font-size:12px;margin-right:8px}
@media(max-width:700px){.workspace{flex-direction:column}.sidebar{width:100%;display:flex;overflow-x:auto;padding:0;border-right:none;border-bottom:1px solid var(--border-color)}.nav-item{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;gap:8px}.nav-item.active{border-bottom-color:var(--primary-red)}.brand-text p,#user-name{display:none}header{padding:8px 12px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="umb" viewBox="0 0 100 100"><path d="M50 50 L31.6 5.7 Q50.0 11.6 68.4 5.7 Z" fill="#e50914" stroke="#8b0000" stroke-width="1.2" stroke-linejoin="round"/><path d="M50 50 L68.4 5.7 Q77.2 22.8 94.3 31.6 Z" fill="#ffffff" stroke="#8b0000" stroke-width="1.2" stroke-linejoin="round"/><path d="M50 50 L94.3 31.6 Q88.4 50.0 94.3 68.4 Z" fill="#e50914" stroke="#8b0000" stroke-width="1.2" stroke-linejoin="round"/><path d="M50 50 L94.3 68.4 Q77.2 77.2 68.4 94.3 Z" fill="#ffffff" stroke="#8b0000" stroke-width="1.2" stroke-linejoin="round"/><path d="M50 50 L68.4 94.3 Q50.0 88.4 31.6 94.3 Z" fill="#e50914" stroke="#8b0000" stroke-width="1.2" stroke-linejoin="round"/><path d="M50 50 L31.6 94.3 Q22.8 77.2 5.7 68.4 Z" fill="#ffffff" stroke="#8b0000" stroke-width="1.2" stroke-linejoin="round"/><path d="M50 50 L5.7 68.4 Q11.6 50.0 5.7 31.6 Z" fill="#e50914" stroke="#8b0000" stroke-width="1.2" stroke-linejoin="round"/><path d="M50 50 L5.7 31.6 Q22.8 22.8 31.6 5.7 Z" fill="#ffffff" stroke="#8b0000" stroke-width="1.2" stroke-linejoin="round"/><circle cx="50" cy="50" r="5" fill="#fff" stroke="#8b0000" stroke-width="1.5"/></symbol></defs></svg>
<div class="scanline"></div>
<div class="hazard-overlay" id="hazard"></div>
<div id="banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:1001;background:var(--primary-red);color:#fff;text-align:center;padding:6px;font-family:var(--font-mono);font-size:12px;letter-spacing:2px;font-weight:bold">⚠ КРАСНАЯ ТРЕВОГА — ВСЕМУ ПЕРСОНАЛУ ПРОЙТИ В УКРЫТИЯ</div>

<div id="login-overlay">
  <div class="login-box">
    <div class="login-header">
      <svg class="umbrella-logo" viewBox="0 0 100 100"><use href="#umb"/></svg>
      <div class="login-title">UMBRELLA CORP.</div>
      <div class="login-subtitle">Центральный терминал // Доступ ограничен</div>
    </div>
    <div class="login-tabs">
      <button class="login-tab-btn active" data-tab="cred">ЛОГИН</button>
      <button class="login-tab-btn" data-tab="support">ПОДДЕРЖКА</button>
    </div>
    <div id="tab-cred">
      <div class="form-group"><label>Идентификатор</label><input class="form-control" id="u-name" autocomplete="off" placeholder="логин"></div>
      <div class="form-group"><label>Пароль</label><input class="form-control" id="u-pass" type="password" placeholder="••••••••"></div>
    </div>
    <div id="tab-support" style="display:none">
      <p style="font-size:13px;line-height:1.6;margin-bottom:16px">Корпорация Umbrella развивается благодаря тем, кто её поддерживает. Любая сумма помогает проекту расти.</p>
      <a class="btn" style="display:block;text-align:center;text-decoration:none" href="https://www.donationalerts.com/r/tytle_play" target="_blank" rel="noopener noreferrer">Поддержать корпорацию</a>
    </div>
    <div class="login-error" id="login-error"></div>
    <button class="btn" id="login-btn">Войти в систему</button>
  </div>
</div>

<div id="app-container">
  <header>
    <div class="brand">
      <svg class="umbrella-logo" viewBox="0 0 100 100"><use href="#umb"/></svg>
      <div class="brand-text"><h1>UMBRELLA CORP.</h1><p>CENTRAL TERMINAL v4.0.2</p></div>
    </div>
    <div class="user-status">
      <span id="user-ava" style="display:inline-flex"></span><span id="user-name"></span>
      <span class="clearance-badge" id="user-badge"></span>
      <button class="logout-btn" id="logout-btn">ВЫХОД</button>
    </div>
  </header>
  <div class="workspace">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="main">
      <div class="content" id="content"></div>
      <div class="term-bar"><span>ТЕРМИНАЛ</span><button id="term-toggle">СКРЫТЬ</button></div>
      <div class="terminal" id="terminal"></div>
    </div>
  </div>
</div>

<script>
const USERS = {
  tytle_play:{pass:'26101971',name:'ID-0001',lvl:4,admin:true},
  tvgirl:{pass:'4589',name:'ID-2001',lvl:2},
  'неботошнит':{pass:'verity',name:'ID-3001',lvl:3},
  gupkachek:{pass:'4267',name:'ID-3002',lvl:3}
};
const LEVELS = {1:'Уровень 1',2:'Уровень 2',3:'Уровень 3',4:'Уровень 4'};
const MODULES = [
  {id:'mon',title:'Мониторинг',lvl:1,render:renderMon},
  {id:'news',title:'Новости',lvl:1,render:renderNews},
  {id:'prof',title:'Профиль',lvl:1,render:renderProf},
  {id:'lab',title:'Лаборатории',lvl:2,render:renderLab},
  {id:'mis',title:'Миссии',lvl:2,render:renderMis},
  {id:'arc',title:'Архив проектов',lvl:3,render:renderArc},
  {id:'red',title:'Красная тревога',lvl:4,render:renderRed},
  {id:'staff',title:'Участники',lvl:4,render:renderStaff}
];
let current = null, alertOn = false;
const $ = id => document.getElementById(id);

function log(msg, cls){
  const d = document.createElement('div');
  if(cls) d.className = cls;
  const t = new Date().toLocaleTimeString('ru-RU');
  d.textContent = '[' + t + '] ' + msg;
  $('terminal').appendChild(d);
  $('terminal').scrollTop = $('terminal').scrollHeight;
  if(termHidden){ termNew++; updTermBtn(); }
}
let termHidden = false, termNew = 0;
function updTermBtn(){
  $('term-toggle').textContent = termHidden ? 'ПОКАЗАТЬ' + (termNew ? ' (' + termNew + ')' : '') : 'СКРЫТЬ';
}
function setTerm(h){
  termHidden = h;
  $('terminal').style.display = h ? 'none' : 'block';
  if(!h){ termNew = 0; $('terminal').scrollTop = $('terminal').scrollHeight; }
  updTermBtn();
  try{ localStorage.setItem('umb_term', h ? '1' : '0'); }catch(_){}
}
$('term-toggle').onclick = () => setTerm(!termHidden);
try{ if(localStorage.getItem('umb_term') === '1') setTerm(true); }catch(_){}

/* Login */
document.querySelectorAll('.login-tab-btn').forEach(b => b.onclick = () => {
  document.querySelectorAll('.login-tab-btn').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  const support = b.dataset.tab === 'support';
  $('tab-cred').style.display = support ? 'none' : 'block';
  $('tab-support').style.display = support ? 'block' : 'none';
  $('login-btn').style.display = support ? 'none' : 'block';
  $('login-error').textContent = '';
});
$('login-btn').onclick = () => {
  const u = USERS[$('u-name').value.trim().toLowerCase()];
  if(u && u.pass === $('u-pass').value) startSession(u);
  else $('login-error').textContent = 'ОШИБКА: неверный идентификатор или пароль';
};
['u-name','u-pass'].forEach(id => $(id).addEventListener('keydown', e => { if(e.key === 'Enter') $('login-btn').click(); }));

function startSession(u){
  current = u;
  $('login-overlay').style.display = 'none';
  $('app-container').style.display = 'flex';
  loadSelfProfile();
  applyHeader();
  const b = $('user-badge');
  b.textContent = LEVELS[u.lvl];
  b.className = 'clearance-badge lvl-' + u.lvl;
  $('terminal').innerHTML = '';
  log('Сессия открыта: ' + u.name + ', ' + LEVELS[u.lvl]);
  buildNav();
  openModule('mon');
  startPresence();
}
$('logout-btn').onclick = () => {
  sendPresence('po');
  stopPresence();
  current = null;
  $('app-container').style.display = 'none';
  $('login-overlay').style.display = 'flex';
  $('u-pass').value = '';
  $('login-error').textContent = '';
};

/* Navigation */
function buildNav(){
  const nav = $('sidebar');
  nav.innerHTML = '';
  MODULES.forEach(m => {
    const ok = current.lvl >= m.lvl;
    const el = document.createElement('div');
    el.className = 'nav-item' + (ok ? '' : ' locked');
    el.dataset.id = m.id;
    el.innerHTML = '<span>' + m.title + '</span><span>' + (ok ? '' : '🔒') + '</span>';
    el.onclick = () => {
      if(ok) openModule(m.id);
      else log('ОТКАЗ В ДОСТУПЕ: «' + m.title + '» требует ' + LEVELS[m.lvl], 't-bad');
    };
    nav.appendChild(el);
  });
}
function openModule(id){
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.id === id));
  renderContent(id);
  log('Открыт модуль: ' + MODULES.find(x => x.id === id).title);
}
function renderContent(id){
  $('content').innerHTML = MODULES.find(x => x.id === id).render();
  const btn = $('alert-btn');
  if(btn) btn.onclick = () => sendAlert(!alertOn);
  if(id === 'mis') bindMissions();
  if(id === 'prof') bindProf();
  if(id === 'staff') bindStaff();
}

/* Modules */
function renderMon(){
  return '<div class="panel"><div class="panel-header">СОСТОЯНИЕ КОМПЛЕКСА</div><div class="panel-body"><div class="grid">' +
    '<div class="stat"><span>Энергия</span><b class="ok">98%</b></div>' +
    '<div class="stat"><span>Персонал</span><b>53</b></div>' +
    '<div class="stat"><span>Карантин</span><b class="warn">2 секции</b></div>' +
    '<div class="stat"><span>Угроза</span><b class="' + (alertOn ? 'bad' : 'ok') + '">' + (alertOn ? 'КРАСНАЯ' : 'НИЗКАЯ') + '</b></div>' +
    '</div></div></div>';

const NEWS = [

/* Общая тревога: BroadcastChannel (вкладки одного браузера) + ntfy.sh (разные устройства) */
const TOPIC = 'umbrella-terminal-x7k2q9'; // замените на свою случайную строку
const NTFY = 'https://ntfy.sh/' + TOPIC;

function applyAlert(on){
  if(on === alertOn) return;
  alertOn = on;
  $('hazard').style.display = on ? 'block' : 'none';
  $('banner').style.display = on ? 'block' : 'none';

    .catch(() => log('Нет сети: тревога видна только на этом устройстве', 't-warn'));
}

/* Миссии: публикует только админ, выполнить может любой с уровнем 2+ */
let MIS = {}, GONE = {};
try{ const c = JSON.parse(localStorage.getItem('umb_mis') || '{}'); MIS = c.m || {}; GONE = c.g || {}; }catch(_){}
function saveMis(){ try{ localStorage.setItem('umb_mis', JSON.stringify({m:MIS, g:GONE})); }catch(_){} }
function esc(v){ return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function applyEvent(ev){
  if(!ev || typeof ev !== 'object' || !ev.id) return;
  const id = String(ev.id).slice(0, 40);
  const by = ev.by ? String(ev.by).slice(0, 20) : '';
  if(ev.t === 'm+'){
    if(MIS[id] || GONE[id]) return;
    MIS[id] = {id, title:String(ev.title || '').slice(0, 80), text:String(ev.text || '').slice(0, 1000), ts:+ev.ts || 0, done:{}, ok:{}};
    if(current) log('Новая миссия: ' + MIS[id].title, 't-warn');
  } else if(ev.t === 'm-'){
    GONE[id] = 1; delete MIS[id];
  } else if(ev.t === 'md' || ev.t === 'mc' || ev.t === 'mr'){
    const m = MIS[id];
    if(!m || !by) return;
    m.done = m.done || {}; m.ok = m.ok || {};
    if(ev.t === 'md'){
      if(m.ok[by] || m.done[by]) return;
      m.done[by] = +ev.ts || 0;
      if(current && current.admin) log('Миссия «' + m.title + '»: ' + by + ' ждёт подтверждения', 't-warn');
    } else if(ev.t === 'mc'){
      if(m.ok[by]) return;
      m.ok[by] = +ev.ts || 0; delete m.done[by];
      if(current && current.name === by) log('Выполнение миссии «' + m.title + '» подтверждено');
    } else {
      if(!m.done[by]) return;
      delete m.done[by];
      if(current && current.name === by) log('Выполнение миссии «' + m.title + '» отклонено. Выполните и отправьте снова', 't-bad');
    }
  } else return;
  saveMis();
  refreshMissions();
}
function publishEv(ev){
  applyEvent(ev);
  if(bc) bc.postMessage(ev);
  fetch(NTFY, {method:'POST', body:JSON.stringify(ev)})
    .catch(() => log('Нет сети: изменение видно только на этом устройстве', 't-warn'));
}

const NTFY_P = NTFY + '-presence';
const ONLINE_MS = 300000;
let PRES = {}, presEs = null, presTimer = null;

function presenceEvent(ev, ts){
  if(!ev || typeof ev !== 'object' || !ev.by) return;
  const by = String(ev.by).slice(0, 20);
  const p = PRES[by] || (PRES[by] = {s:0, o:0});
  if(ev.t === 'p') p.s = Math.max(p.s, ts);
  else if(ev.t === 'po'){ p.o = Math.max(p.o, ts); p.s = Math.max(p.s, ts); }
  else return;
  try{ localStorage.setItem('umb_pres', JSON.stringify(PRES)); }catch(_){}
  refreshStaff();
}
function sendPresence(t){
  if(!current) return;
  const ev = {t, by:current.name};
  presenceEvent(ev, Date.now());
  fetch(NTFY_P, {method:'POST', body:JSON.stringify(ev), keepalive:true}).catch(() => {});
}
function startPresence(){
  stopPresence();
  sendPresence('p');
  if(current.nick || current.avatar) publishProfile();
  presTimer = setInterval(() => { if(!document.hidden) sendPresence('p'); }, 120000);
  if(current.lvl >= 4){

          presenceEvent(JSON.parse(d.message), d.time ? d.time * 1000 : Date.now());
        }catch(_){}
      };
    }catch(_){}
  }
}

}

function ago(ms){
  const m = Math.round(ms / 60000);
  if(m < 1) return 'только что';
  if(m < 60) return m + ' мин назад';
  const h = Math.round(m / 60);
  return h < 48 ? h + ' ч назад' : Math.round(h / 24) + ' дн назад';
}
const NTFY_PF = NTFY + '-profiles';
const AVA_IMG = /^data:image\/(jpeg|webp);base64,[A-Za-z0-9+\/=]{20,6000}$/;
let PROFS = {}, pfEs = null, selStaff = null, draftAva = '';
try{ PROFS = JSON.parse(localStorage.getItem('umb_profs') || '{}'); }catch(_){}

function cleanNick(v){ return String(v || '').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 24); }
function cleanAva(a){
  a = String(a || '');
  if(AVA_IMG.test(a)) return a;
  if(a.startsWith('e:') && a.length <= 12 && !/[<>&"']/.test(a)) return a;
  return '';
}
function avaHtml(a, size){

  const st = 'width:' + size + 'px;height:' + size + 'px;border-radius:50%;flex-shrink:0;border:1px solid var(--border-color);';
  a = cleanAva(a);
  if(a && !a.startsWith('e:')) return '<img src="' + a + '" alt="" style="' + st + 'object-fit:cover">';
  const e = a ? esc(a.slice(2)) : '☂';
  return '<span style="' + st + 'display:inline-flex;align-items:center;justify-content:center;background:#000;font-size:' + Math.round(size * 0.55) + 'px">' + e + '</span>';

    pfEs = new EventSource(NTFY_PF + '/sse?since=12h');

      }catch(_){}
    };

function makeAvatar(file, cb){
  const fr = new FileReader();
  fr.onerror = () => cb(null);
  fr.onload = () => {
    const img = new Image();
    img.onerror = () => cb(null);
    img.onload = () => {
      for(const sz of [72, 56, 44, 32]) for(const q of [0.7, 0.5, 0.35]){
        const c = document.createElement('canvas'); c.width = c.height = sz;
        const m = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, sz, sz);
        const u = c.toDataURL('image/jpeg', q);
        if(u.length < 2800){ cb(u); return; }
      }
      cb(null);
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

            : '<span style="color:var(--text-muted)">○ ' + (seen ? 'был ' + ago(now - seen) : 'не в сети') + '</span>';

function staffRows(){
  const now = Date.now();
  const rows = Object.keys(USERS).map(login => {
    const u = USERS[login], p = PRES[u.name] || {s:0, o:0};
    return {login, u, seen:p.s, on: p.s > p.o && now - p.s < ONLINE_MS};
  }).sort((a, b) => (b.on - a.on) || (b.u.lvl - a.u.lvl));
  const online = rows.filter(r => r.on).length;
  const tr = rows.map(r => {
    const pr = PROFS[r.u.name] || {};

  }).join('');
  return '<p style="margin-bottom:12px;font-family:var(--font-mono);font-size:12px">В сети: <b class="ok">' + online + '</b> из ' + rows.length +
    ' · нажмите на строку, чтобы открыть профиль</p>' +
    '<div style="overflow-x:auto"><table><tr><th></th><th>Имя</th><th>ID</th><th>Позывной</th><th>Ур.</th><th>Статус</th></tr>' + tr + '</table></div>' + profCard(now);
}
function profCard(now){
  const u = selStaff && USERS[selStaff];
  if(!u) return '';
  const pr = PROFS[u.name] || {}, p = PRES[u.name] || {s:0, o:0};
  return '<div style="margin-top:16px;border:1px solid var(--border-red);border-radius:4px;padding:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap">' +
    avaHtml(pr.ava, 72) + '<div style="line-height:1.8;font-size:13px">Имя в системе: <b>' + esc(pr.nick || 'не задано') + '</b><br>ID: ' + esc(u.name) +
    '<br>Позывной: ' + esc(selStaff) + '<br>Уровень: ' + u.lvl + '<br>Статус: ' + statusHtml(p.s > p.o && now - p.s < ONLINE_MS, p.s, now) +
    '<br><span style="color:var(--text-muted)">' + (pr.ts ? 'Профиль обновлён ' + ago(now - pr.ts) : 'Профиль не настроен или ещё не получен') + '</span></div></div>';
}
function renderStaff(){
  return '<div class="panel"><div class="panel-header">УЧАСТНИКИ КОРПОРАЦИИ</div><div class="panel-body" id="staff-list">' + staffRows() + '</div></div>';
}
function refreshStaff(){
  const l = $('staff-list');
  if(l && current && current.lvl >= 4) l.innerHTML = staffRows();
}
function bindStaff(){
  $('staff-list').onclick = e => {
    const tr = e.target.closest('tr[data-login]');
    if(!tr || !current || current.lvl < 4) return;
    selStaff = selStaff === tr.dataset.login ? null : tr.dataset.login;
    refreshStaff();
  };
}
setInterval(refreshStaff, 15000);

/* Автообновление: страница сама замечает новую версию на сайте */
const APP_VERSION = '2026-10-29-5';
let updShown = false;
function showUpdate(){
  if(updShown) return;
  updShown = true;
  if(!current){ location.replace(location.pathname + '?u=' + Date.now()); return; }
  const b = document.createElement('div');
  b.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:1002;background:var(--bg-panel);border:1px solid var(--primary-red);padding:10px 14px;font-family:var(--font-mono);font-size:12px;border-radius:4px;box-shadow:0 0 15px var(--primary-red-glow)';
  b.innerHTML = 'Доступна новая версия терминала.<button class="btn btn-sm" id="upd-btn" style="display:block;margin:8px 0 0">Обновить</button>';
  document.body.appendChild(b);
  document.getElementById('upd-btn').onclick = () => location.replace(location.pathname + '?u=' + Date.now());
}
async function checkUpdate(){
  try{
    const r = await fetch(location.pathname + '?v=' + Date.now(), {cache:'no-store'});
    const m = (await r.text()).match(/APP_VERSION\s*=\s*'([^']+)'/);
    if(m && m[1] !== APP_VERSION) showUpdate();
  }catch(_){}
}
setInterval(checkUpdate, 60000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkUpdate(); });
</script>
